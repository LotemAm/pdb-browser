name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-cache
            build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        run: |
          mkdir package
          copy build\Release\pdb-browser.exe package\
          copy build\Release\msdia140.dll package\
          Compress-Archive -Path package\* -DestinationPath pdb-browser.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdb-browser
          path: package/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdb-browser.zip
          generate_release_notes: true
